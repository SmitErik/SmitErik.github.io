<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday!</title>
  <link rel="icon" type="image/x-icon" href="images/cake.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--YouTube stuff-->
  <div id="youtube"></div>
  <script src="yt.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <!--Gift Box-->
  <div id="gift-box">
    <div class="ribbon"></div>
    <div class="ribbon"></div>
    <img id="red-bow" src="images/red-bow.png" alt="red-bow">
  </div>

  <!--Happy Birthday background text-->
  <img id="happy-birthday" src="images/happy-birthday.png" alt="happy-birthday">

  <!--Character image container-->
  <div id="images" class="hidden">
    <img id="kokomi" src="images/kokomi.png" alt="kokomi">
    <img id="yelan" src="images/yelan.png" alt="yelan">
    <img id="xiao" src="images/xiao.png" alt="xiao">
    <img id="kuki" src="images/kuki.png" alt="kuki">
    <img id="alyosha" src="images/alyosha.png" alt="alyosha">
    <img id="bennett" src="images/bennett.png" alt="bennett">
    <img id="xingqiu" src="images/xingqiu.png" alt="xingqiu">
    <img id="alhaitham" src="images/alhaitham.png" alt="alhaitham">

    <img id="citlali" src="images/citlali.png" alt="citlali">
    <img id="kinich" src="images/kinich.png" alt="kinich">
    <img id="xiangling" src="images/xiangling.png" alt="xiangling">
    <img id="odette" src="images/odette.png" alt="odette">
    <img id="yae-miko" src="images/yae-miko.png" alt="yae-miko">
    <img id="qiqi" src="images/qiqi.png" alt="qiqi">
    <img id="cyno" src="images/cyno.png" alt="cyno">
    <img id="zhongli" src="images/zhongli.png" alt="zhongli">

    <img id="paimon" src="images/paimon.png" alt="paimon">
  </div>

  <!--Cake Description-->
  <div id="cake-desc-container">
    <img id="cake-desc" src="images/cake-desc.png" alt="cake-desc">
  </div>

  <!--Subtitles-->
  <div id="subtitle-container">
    <span id="speaker"></span>
    <span id="subtitle"></span>
  </div>

  <!--Main JavaScript-->
  <script src="script.js"></script>
</body>
</html>
